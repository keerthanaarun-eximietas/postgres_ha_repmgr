node_id=1
node_name='server1'

conninfo='host=192.168.28.12 port=5543 user=repmgr dbname=repmgr connect_timeout=5 passfile=/var/lib/postgresql/data/.pgpass'

data_directory='/var/lib/postgresql/data'
pg_bindir='/usr/lib/postgresql/17/bin'

use_replication_slots=true

monitor_interval_secs=2
log_level=INFO
log_file='/var/lib/postgresql/data/repmgr.log'

monitoring_history=yes
connection_check_type=ping
failover=automatic

promote_command='/usr/bin/repmgr standby promote -f /etc/repmgr/repmgr.conf --log-to-file'

follow_command='/usr/bin/repmgr standby follow -f /etc/repmgr/repmgr.conf --log-to-file --upstream-node-id=%n'